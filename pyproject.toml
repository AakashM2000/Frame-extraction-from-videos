[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blade-coating-vision"
version = "0.1.0"
description = "CVAT, U-Net and calibrated offline blade-coating video measurements"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=10", "torch>=2.4", "av>=12", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["blade_coating_segmentation*"]
